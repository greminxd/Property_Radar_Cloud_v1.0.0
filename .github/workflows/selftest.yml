name: Selftest
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/selftest.py
      - run: python -m unittest discover -s scraper -p "test_*.py" -v
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --check src/index.js
      - run: node --check public/app.js && node --check public/workspace.js
