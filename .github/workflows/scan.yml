name: Scan nieruchomosci

on:
  workflow_dispatch:

concurrency:
  group: property-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run scan
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          PANEL_URL: https://property-radar.hoolz.workers.dev
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PYTHONUNBUFFERED: "1"
        run: python -u scraper/main.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scan-diagnostics-${{ github.run_number }}
          path: logs/
          retention-days: 14
